name: SAST

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test custom rules (positive and negative cases)
        run: semgrep --test .semgrep/

      # Documented false positives (excluded by rule id, not by file):
      # - express-cookie-session-no-expires: the session cookie expires through maxAge.
      #   express-session documents that `expires` should not be set directly; maxAge
      #   produces the Expires attribute per session. The rule only recognises `expires`.
      # - express-cookie-session-no-domain: no Domain attribute keeps the cookie host-only,
      #   which is stricter than any Domain value (a Domain also covers subdomains).
      # scripts/smoke-test.sh asserts the real Set-Cookie header (Expires present, no
      # Domain, plus HttpOnly, Secure, SameSite=Strict, Path=/) on every CI run.
      # - django-no-csrf-token: a Django rule applied to every *.html file. It looks for
      #   Django's {% csrf_token %} tag, which does not exist in Swig. NodeGoat's forms
      #   carry the CSRF token as a hidden _csrf field (the rule flagged login.html even
      #   though it had one). scripts/smoke-test.sh proves the real control: forged POSTs
      #   without a token or with a wrong one get 403 and change nothing.
      # - express-check-csurf-middleware-usage: only recognises the csurf and csrf packages.
      #   CSRF protection is csrf-sync (app/csrf.js), which replaced the archived csurf.
      #   test/ci/csrf.test.js and the smoke test's forged-request checks prove it.
      - name: Run Semgrep
        run: >-
          semgrep --config auto --config .semgrep/custom-rules.yml --error
          --exclude-rule javascript.express.security.audit.express-cookie-settings.express-cookie-session-no-expires
          --exclude-rule javascript.express.security.audit.express-cookie-settings.express-cookie-session-no-domain
          --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token
          --exclude-rule javascript.express.security.audit.express-check-csurf-middleware-usage.express-check-csurf-middleware-usage
          .
