name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Disposable MongoDB for the smoke test (synthetic seed data only).
    services:
      mongo:
        image: mongo:8.0@sha256:479e85ced54ffb8a40dade1dcde2da2a9ae858515b9415e9cc54bfb8f0575d01
        ports:
          - 127.0.0.1:27017:27017

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/nodegoat

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same major as the runtime image (Chainguard node, pinned in the Dockerfile).
          # Not 'current': that resolved to a v27 alpha. Bump with the base image.
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Lint (ESLint; replaces upstream jshint)
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # Runs even when lint or unit tests fail, so a red run still shows what the
      # app does against a real MongoDB (e.g. an exploit test written before its fix).
      # The job stays failed, and the build and package steps after it still skip.
      - name: Smoke test against seeded MongoDB
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./scripts/smoke-test.sh

      - name: Build
        run: npm run build --if-present

      - name: Package application
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='coverage' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.npmrc' \
            --exclude='infra/.terraform' \
            -czf "$RUNNER_TEMP/app.tar.gz" .

      - name: Upload application package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ github.sha }}
          path: ${{ runner.temp }}/app.tar.gz
          if-no-files-found: error
          retention-days: 14

