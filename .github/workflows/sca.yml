name: SCA

on: [push, pull_request]

permissions:
  contents: read

jobs:
  sca:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy (checksum verified)
        shell: bash
        env:
          # Direct download pinned by SHA-256 (from the release's trivy_0.74.0_checksums.txt).
          # Replaces install.sh, whose unauthenticated GitHub release lookup started failing,
          # and rejects any release file replaced after pinning.
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --retry 5 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "${RUNNER_TEMP}/trivy.tar.gz"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/trivy.tar.gz" | sha256sum --check --strict

          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C "${RUNNER_TEMP}/trivy-bin" trivy

          echo "${RUNNER_TEMP}/trivy-bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/trivy-bin/trivy" --version

      - name: Generate SBOM
        run: trivy fs --format cyclonedx --include-dev-deps --output sbom.json .

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: 14

      # Midterm standard: block every severity, including UNKNOWN and unfixed findings.
      - name: Scan dependencies for vulnerabilities at every severity
        run: trivy fs --scanners vuln --include-dev-deps --exit-code 1 .