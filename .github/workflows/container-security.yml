name: Container Security

on:
  push:
  pull_request:
  # Adds a manual "Run workflow" button, needed for the Lab 10 Step 5 gate test.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-security:
    runs-on: ubuntu-latest

    # Disposable MongoDB so the built image can be started and tested, not only scanned.
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 127.0.0.1:27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Supply chain: refuse to build on a base image Chainguard did not sign.
      - name: Verify base image signatures (Chainguard)
        shell: bash
        run: |
          set -euo pipefail
          for image in $(awk 'toupper($1) == "FROM" {print $2}' Dockerfile | sort -u); do
            echo "Verifying ${image}"
            cosign verify \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              --certificate-identity=https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main \
              "${image}" > /dev/null
            echo "ok - ${image} is signed by Chainguard's release workflow"
          done

      - name: Build hardened container image
        run: docker build -t nodegoat:${{ github.sha }} .

      # The image must actually run under the same restrictions as Compose/Kubernetes:
      # non-root, read-only root filesystem, no capabilities, no privilege escalation.
      - name: Start the image and check it serves HTTPS
        shell: bash
        run: |
          set -euo pipefail
          echo "Node.js in image: $(docker run --rm nodegoat:${{ github.sha }} --version)"
          tls="${RUNNER_TEMP}/tls"
          bash scripts/dev-cert.sh "$tls" > /dev/null
          secret() { node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))'; }
          docker run --rm --network host \
            -e MONGODB_URI=mongodb://127.0.0.1:27017/nodegoat \
            -e SESSION_SECRET="$(secret)" -e CRYPTO_KEY="$(secret)" \
            nodegoat:${{ github.sha }} artifacts/db-reset.js > /dev/null
          docker run -d --name app --network host \
            --user 65532:65532 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            -v "$tls:/run/secrets/tls:ro" \
            -e TLS_KEY_FILE=/run/secrets/tls/tls.key -e TLS_CERT_FILE=/run/secrets/tls/tls.crt \
            -e MONGODB_URI=mongodb://127.0.0.1:27017/nodegoat \
            -e SESSION_SECRET="$(secret)" -e CRYPTO_KEY="$(secret)" \
            nodegoat:${{ github.sha }}
          for _ in $(seq 1 30); do
            code="$(curl --silent --cacert "$tls/tls.crt" --output /dev/null --write-out '%{http_code}' \
              https://127.0.0.1:4000/login || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker logs app
          [ "$code" = "200" ] || { echo "::error::container did not serve /login (last status ${code})"; exit 1; }
          echo "ok - hardened container serves https://127.0.0.1:4000/login (200)"
          docker rm -f app > /dev/null

      - name: Hadolint Dockerfile
        run: docker run --rm -i hadolint/hadolint < Dockerfile

      - name: Install Trivy
        shell: bash
        env:
          TRIVY_VERSION: v0.74.0
          TRIVY_INSTALL_COMMIT: e1fd17a0ea4a8cf24bc4b4dd7e2cfbf4bb31b994
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_INSTALL_COMMIT}/contrib/install.sh" \
            --output "${RUNNER_TEMP}/install-trivy.sh"

          mkdir -p "${RUNNER_TEMP}/trivy-bin"

          sh "${RUNNER_TEMP}/install-trivy.sh" \
            -b "${RUNNER_TEMP}/trivy-bin" "${TRIVY_VERSION}"

          echo "${RUNNER_TEMP}/trivy-bin" >> "$GITHUB_PATH"

      # Midterm standard: block every severity, including UNKNOWN and unfixed findings
      # (no --severity filter, no --ignore-unfixed).
      - name: Scan image for vulnerabilities at every severity
        run: |
          trivy image \
            --scanners vuln \
            --exit-code 1 \
            nodegoat:${{ github.sha }}

      # Documented exception EX-01 (docs/security-exceptions.md): the official MongoDB
      # image is third-party and cannot meet the every-severity standard (Ubuntu
      # packages with no fix, plus old Go toolchains in its bundled tools and gosu).
      # It is scanned on every run and reported, but does not block. The exception
      # does not cover anything this repository builds, signs or deploys.
      - name: Report MongoDB image vulnerabilities (exception EX-01, non-blocking)
        run: |
          trivy image --scanners vuln --exit-code 0 mongo:8.0

  # Each scanner is its own workflow, so "needs:" cannot see them. Before anything is
  # published or signed, wait for the other required checks on this same commit and
  # stop unless every one of them passed (midterm requirement: only digests that pass
  # all checks are released).
  release-gate:
    name: Release Gate
    needs: container-security
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      checks: read

    env:
      GH_TOKEN: ${{ github.token }}
      # Check-run (job) names from ci.yml, sast.yml, sca.yml, secret-scan.yml, action-pinning.yml.
      REQUIRED_CHECKS: "build-test|Semgrep SAST|sca|Gitleaks|Enforce Action SHA Pins"

    steps:
      - name: Wait for all required checks on this commit
        shell: bash
        run: |
          set -euo pipefail
          IFS='|' read -r -a required <<< "$REQUIRED_CHECKS"

          for attempt in $(seq 1 80); do
            # filter=latest keeps only the newest run of each check name.
            runs="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=latest&per_page=100" \
              --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion)"')"

            pending=0
            failed=0
            for name in "${required[@]}"; do
              line="$(printf '%s\n' "$runs" | awk -F'\t' -v n="$name" '$1 == n' | head -n 1)"
              status="$(printf '%s' "$line" | cut -f2)"
              conclusion="$(printf '%s' "$line" | cut -f3)"
              if [ -z "$line" ] || [ "$status" != "completed" ]; then
                pending=1
                echo "waiting: ${name} (${status:-not started})"
              elif [ "$conclusion" != "success" ]; then
                failed=1
                echo "::error::Required check '${name}' concluded '${conclusion}'; not publishing or signing."
              else
                echo "passed:  ${name}"
              fi
            done

            [ "$failed" -eq 0 ] || exit 1
            if [ "$pending" -eq 0 ]; then
              echo "All required checks passed for ${GITHUB_SHA}."
              exit 0
            fi
            sleep 15
          done

          echo "::error::Timed out waiting for required checks."
          exit 1

  publish-sign:
    name: Publish, Sign, Attest
    needs: [container-security, release-gate]

    # Publish only on pushes to main, or on a manual run (used for the Step 5 test).
    # Pull requests never publish, sign, attest, or request OIDC tokens.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    # Passed to the verify and deploy jobs. $GITHUB_ENV does not cross jobs.
    outputs:
      image-repo: ${{ steps.image.outputs.image-repo }}
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Define image name
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE="${IMAGE_REPO}:${GITHUB_SHA}"

          echo "IMAGE_REPO=${IMAGE_REPO}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          echo "Image: ${IMAGE}"

      - name: Build image for publishing
        run: docker build -t "$IMAGE" .

      - name: Install Trivy
        shell: bash
        env:
          TRIVY_VERSION: v0.74.0
          TRIVY_INSTALL_COMMIT: e1fd17a0ea4a8cf24bc4b4dd7e2cfbf4bb31b994
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_INSTALL_COMMIT}/contrib/install.sh" \
            --output "${RUNNER_TEMP}/install-trivy.sh"

          mkdir -p "${RUNNER_TEMP}/trivy-bin"

          sh "${RUNNER_TEMP}/install-trivy.sh" \
            -b "${RUNNER_TEMP}/trivy-bin" "${TRIVY_VERSION}"

          echo "${RUNNER_TEMP}/trivy-bin" >> "$GITHUB_PATH"

      - name: Gate published image on vulnerabilities at every severity
        run: |
          trivy image \
            --scanners vuln \
            --exit-code 1 \
            "$IMAGE"

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Push image
        run: docker push "$IMAGE"

      - name: Resolve immutable image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail

          DIGEST="$(
            docker buildx imagetools inspect "$IMAGE" |
            awk '/^Digest:/ {print $2}'
          )"

          if [ -z "$DIGEST" ]; then
            echo "Unable to resolve image digest"
            exit 1
          fi

          IMAGE_REF="${IMAGE_REPO}@${DIGEST}"

          # For later steps in this job
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"

          # For the verify and deploy jobs
          echo "image-repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          echo "Image: ${IMAGE_REF}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image with GitHub OIDC
        run: cosign sign --yes "$IMAGE_REF"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image-repo }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  verify:
    name: Verify Provenance and Signature
    needs: publish-sign
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      attestations: read

    env:
      IMAGE_REF: ${{ needs.publish-sign.outputs.image-repo }}@${{ needs.publish-sign.outputs.digest }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Verify build provenance
        run: |
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/container-security.yml"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify Cosign signature
        run: |
          cosign verify "${IMAGE_REF}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container-security.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  deploy:
    name: Deploy
    needs: [publish-sign, verify]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy (placeholder)
        run: echo "Would deploy ${{ needs.publish-sign.outputs.image-repo }}@${{ needs.publish-sign.outputs.digest }}"