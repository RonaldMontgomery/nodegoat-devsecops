apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodegoat
  namespace: nodegoat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodegoat
  template:
    metadata:
      labels:
        app: nodegoat
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nodegoat
          image: nodegoat:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 4000
          env:
            - name: MONGODB_URI
              value: mongodb://mongo.nodegoat.svc.cluster.local:27017/nodegoat
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: nodegoat-secrets
                  key: SESSION_SECRET
            - name: CRYPTO_KEY
              valueFrom:
                secretKeyRef:
                  name: nodegoat-secrets
                  key: CRYPTO_KEY
            # HTTPS only (fix for A6): key and certificate from the nodegoat-tls Secret.
            - name: TLS_KEY_FILE
              value: /run/secrets/tls/tls.key
            - name: TLS_CERT_FILE
              value: /run/secrets/tls/tls.crt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /login
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /run/secrets/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # kubernetes.io/tls Secret with tls.key and tls.crt (see README runbook).
        - name: tls
          secret:
            secretName: nodegoat-tls
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: nodegoat
  namespace: nodegoat
spec:
  # ClusterIP only; reach the app with: kubectl -n nodegoat port-forward svc/nodegoat 4000:4000
  # then open https://localhost:4000
  type: ClusterIP
  selector:
    app: nodegoat
  ports:
    - name: https
      port: 4000
      targetPort: https
