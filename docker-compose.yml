# Local and EC2 runtime. Hardened from upstream NodeGoat (Lab 6, threats T5-T7):
# - MongoDB has no published port and sits on an internal-only network
# - the app port binds to localhost only (reach EC2 through an SSM tunnel)
# - non-root, read-only root filesystem, all capabilities dropped, no-new-privileges
# - CPU/memory limits; secrets come from the git-ignored .env file
#
# - HTTPS only: the TLS key/certificate are mounted read-only from artifacts/cert
#
# Usage:  cp .env.example .env   # fill in values
#         scripts/dev-cert.sh     # throwaway self-signed certificate (git-ignored)
#         docker compose up --build   # then open https://localhost:4000

name: nodegoat

services:
  mongo:
    image: mongo:9.0@sha256:b0c835c26e5997413e985000f1013c275377cd9607761c1784d486f6dd620b7f
    # Cap the WiredTiger cache so mongod stays inside the 512M memory limit
    # (by default it sizes the cache from the host's RAM, not the container's).
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    user: "999:999"
    expose:
      - "27017"
    networks:
      - backend
    volumes:
      - mongo-data:/data/db
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # One-shot job: load the synthetic seed data, then exit.
  seed:
    build: .
    image: nodegoat:local
    command: ["artifacts/db-reset.js"]
    environment: &app-env
      MONGODB_URI: mongodb://mongo:27017/nodegoat
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      CRYPTO_KEY: ${CRYPTO_KEY:?set CRYPTO_KEY in .env}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  web:
    image: nodegoat:local
    environment:
      <<: *app-env
      TLS_KEY_FILE: /run/secrets/tls/tls.key
      TLS_CERT_FILE: /run/secrets/tls/tls.crt
    volumes:
      - ./artifacts/cert:/run/secrets/tls:ro
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - frontend
      - backend
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  mongo-data: {}
