{% extends "./layout.html" %} {% block title %}Research{% endblock %} {% block content %}

<div class="row">
    <div class="col-lg-12">

        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">
                    Stock Market Research
                </h3>
            </div>

            <div class="panel-body">

                <form action="/research" method="get" role="search">
                    <div class="form-group">
                        <!-- Fix for SSRF: no "url" field; the server only accepts a symbol and
                        redirects to a fixed quote site instead of fetching anything itself. -->
                        <input type="text" class="form-control" placeholder="Stock Symbol" name="symbol" maxlength="12" />
                        <p class="help-block">Enter Stock Symbol. Opens the quote on Yahoo Finance.</p>
                        {% if symbolError %}
                        <p class="text-danger">{{symbolError}}</p>
                        {% endif %}
                    </div>

                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
